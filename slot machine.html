<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Slot Machine</title>
        <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        /* Master container layout splitting left and right sides */
        .game-container {
            display: flex;
            width: 650px;
            height: 400px;
            border: 3px solid #000;
            box-shadow: 0px 10px 20px rgba(0,0,0,0.5);
        }
        /* Left Display Graphic panel */
        .slot-display-panel {
            background-color: #ffd633;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-right: 3px solid #000;
        }
        .logo {
            font-size: 32px;
            font-weight: bold;
            color: #ff3366;
            letter-spacing: 4px;
            border: 2px solid #000;
            padding: 5px 15px;
            background: #fff;
        }
        .machine-box {
            background-color: #f0f0f0;
            border: 3px solid #000;
            border-radius: 8px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 90%;
            height: 120px;
            overflow: hidden;
        }
        .slot {
            font-size: 48px;
            width: 70px;
            text-align: center;
            transition: transform 0.1s ease-out;
        }

        /* SPINNING ANIMATION EFFECT */
        .spinning {
            animation: reelSpin 0.15s linear infinite;
        }

        @keyframes reelSpin {
            0% { 
                transform: translateY(-20px); 
                filter: blur(4px); 
            }
            50% {
                filter: blur(6px);
            }
            100% { 
                transform: translateY(20px); 
                filter: blur(4px); 
            }
        }

        .version {
            align-self: flex-start;
            font-weight: bold;
            font-size: 14px;
        }
        /* Right side menu setup */
        .control-panel {
            background-color: #ff9933;
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            justify-content: flex-start;
        }
        .counter-box {
            background-color: #ffe6cc;
            font-size: 24px;
            font-weight: bold;
            padding: 15px;
            border: 2px solid #000;
            margin-bottom: 20px;
        }
        .button-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .button-row2 {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        button {
            flex: 1;
            font-size: 20px;
            font-weight: bold;
            padding: 12px;
            border: 2px solid #000;
            cursor: pointer;
            background-color: #fff;
            transition: background 0.1s;
        }
        button:active {
            background-color: #ddd;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
            opacity: 0.6;
        }
        #spin-btn {
            background-color: #ffcc66;
        }
        #reset-btn {
            background-color: #ff6666;
            color: white;
        }
        .status-box {
            margin-top: auto;
            font-weight: bold;
            font-size: 18px;
            text-align: center;
            background: rgba(255,255,255,0.2);
            padding: 10px;
            border-radius: 4px;
        }
    </style>
    </head>
    <body>
        <div class="game-container">
            <!-- Left Side: Slot Graphic Box -->
            <div class="slot-display-panel">
                <div class="logo">SLOT</div>
                <div class="machine-box">
                    <div class="slot" id="slot1">🍒</div>
                    <div class="slot" id="slot2">🍒</div>
                    <div class="slot" id="slot3">🍒</div>
                </div>
                <div class="version">v1.0</div>
            </div>

            <!-- Right Side: Interaction Panel -->
            <div class="control-panel">
                <div class="counter-box">
                    Spins: <span id="spin-count">100</span>
                </div>
                <div class="button-row">
                    <button id="spin-btn">Spin</button>
                    <button id="reset-btn">Reset</button>
                    <button id="buyspins-btn">Buy Spins</button>
                </div>
                <div id="cashcount">
                    Cash: <span id="cash-amount">0</span>
                </div>
                <div class="button-row2">
                    <button id="luck-buy-btn">Upgrade Luck - <span id="Luck-upgrd-cost">0</span></button>
                </div>
                <div class="status-box" id="game-status">Press Spin to
                    Start!</div>
            </div>
        </div>
        <script src="slotmachine.js"></script>
    </body>
</html>
